# Desk is the default service. SpiderFoot local CLI stays off unless you set
# SPIDERFOOT_ENABLED=1. Optional `runner` profile starts the dedicated
# spiderfoot-runner (same layout as Render Starter pserv).
services:
  osint-desk:
    build: .
    ports:
      - "43145:8742"
    environment:
      PORT: ${PORT:-8742}
      HIBP_API_KEY: ${HIBP_API_KEY:-}
      NUMVERIFY_API_KEY: ${NUMVERIFY_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      PDL_API_KEY: ${PDL_API_KEY:-}
      ABSTRACT_PHONE_API_KEY: ${ABSTRACT_PHONE_API_KEY:-}
      SHERLOCK_FULL: ${SHERLOCK_FULL:-}
      SHERLOCK_NSFW: ${SHERLOCK_NSFW:-}
      HEAVY_SCANNER_CONCURRENCY: ${HEAVY_SCANNER_CONCURRENCY:-1}
      HOLEHE_TIMEOUT: ${HOLEHE_TIMEOUT:-75}
      SHERLOCK_TIMEOUT: ${SHERLOCK_TIMEOUT:-90}
      MAIGRET_TIMEOUT: ${MAIGRET_TIMEOUT:-100}
      MAIGRET_TOP_SITES: ${MAIGRET_TOP_SITES:-50}
      MAIGRET_MAX_CONNECTIONS: ${MAIGRET_MAX_CONNECTIONS:-10}
      MAIGRET_FULL: ${MAIGRET_FULL:-}
      SOCIAL_USERNAME_CANDIDATES: ${SOCIAL_USERNAME_CANDIDATES:-2}
      # Local in-process CLI (off by default). Remote runner wins when URL+token set.
      SPIDERFOOT_ENABLED: ${SPIDERFOOT_ENABLED:-0}
      SPIDERFOOT_URL: ${SPIDERFOOT_URL:-}
      SPIDERFOOT_RUNNER_TOKEN: ${SPIDERFOOT_RUNNER_TOKEN:-}
      SPIDERFOOT_TIMEOUT: ${SPIDERFOOT_TIMEOUT:-75}
      SPIDERFOOT_USECASE: ${SPIDERFOOT_USECASE:-}
      SPIDERFOOT_MODULES: ${SPIDERFOOT_MODULES:-}
      SPIDERFOOT_MAX_THREADS: ${SPIDERFOOT_MAX_THREADS:-2}
      SPIDERFOOT_HOME: ${SPIDERFOOT_HOME:-/opt/spiderfoot}
    restart: unless-stopped

  spiderfoot-runner:
    profiles: ["runner"]
    build:
      context: .
      dockerfile: spiderfoot-runner/Dockerfile
    ports:
      - "10000:10000"
    environment:
      PORT: ${SPIDERFOOT_RUNNER_PORT:-10000}
      SPIDERFOOT_RUNNER_TOKEN: ${SPIDERFOOT_RUNNER_TOKEN:-dev-runner-token}
      SPIDERFOOT_HOME: /opt/spiderfoot
      SPIDERFOOT_MAX_THREADS: ${SPIDERFOOT_MAX_THREADS:-8}
      SPIDERFOOT_SKIP_DISTRUST: ${SPIDERFOOT_SKIP_DISTRUST:-1}
      SPIDERFOOT_ACCOUNTS_MAX_SITES: ${SPIDERFOOT_ACCOUNTS_MAX_SITES:-120}
      SPIDERFOOT_CACHE: /opt/spiderfoot/cache
    restart: unless-stopped
